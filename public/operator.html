<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="theme-color" content="#1a73e8">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bingo - Operador</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header style="padding: 1rem; text-align: center; border-bottom: 1px solid #eee;">
    <h1>👨‍💼 Modo Operador</h1>
    <div>Bingo Digital</div>
  </header>

  <main style="padding: 1.5rem; max-width: 800px; margin: 0 auto;">
    <!-- Grupo: Sorteio -->
    <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center;">
      <button id="draw-btn" class="btn">🎲 Sortear Número (ESPAÇO)</button>
      <button id="reset-btn" class="btn" style="background:#d93025;">🔄 Reiniciar Jogo</button>
      <button id="toggle-theme" class="btn" style="background:#f9ab00;">🌙 Modo Escuro</button>
      <button id="toggle-sound" class="btn" style="background:#9c27b0;">🔊 Som: LIGADO</button>
    </div>

    <!-- Contador de números -->
    <div id="counter" style="text-align: center; font-size: 1.1rem; margin: 1rem 0; color: #5f6368;"></div>

    <h3 style="margin-top: 2rem;">⚙️ Configuração de Números</h3>
    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 2rem;">
      <label>
        De: <input type="number" id="min-num" min="1" max="99" value="1" style="width: 60px;">
      </label>
      <label>
        Até: <input type="number" id="max-num" min="2" max="100" value="75" style="width: 60px;">
      </label>
      <button id="apply-range" class="btn" style="background:#f9ab00;">Aplicar</button>
    </div>

    <div id="current" style="margin: 1.5rem 0; font-size: 2.5rem; text-align: center; font-weight: bold;">
      Aguardando sorteio...
    </div>

    <h3>Números Sorteados:</h3>
    <div id="history-list" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem;"></div>

    <h3 style="margin-top: 2rem;">🎉 Declaração de Vitória</h3>
    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
      <button id="bingo-line" class="btn" style="background:#0f9d58;">Horizontal (H)</button>
      <button id="bingo-column" class="btn" style="background:#4285f4;">Vertical (V)</button>
      <button id="bingo-full" class="btn" style="background:#db4437;">Cartela Cheia! (F)</button>
    </div>
    <div style="text-align: center; margin-top: 2.5rem; font-size: 0.9rem; color: #5f6368; padding-top: 1.5rem; border-top: 1px solid #eee;">
   Feito com ❤️ por 
   <a href="https://www.instagram.com/martins_labs/" target="_blank" style="color: #1a73e8; text-decoration: none;">Martins Labs</a>
   • @martins_labs
</div>
  </main>

  <script type="module" src="./js/ui/operator-ui.js"></script>
</body>
</html>
