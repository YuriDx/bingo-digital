<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="theme-color" content="#1a73e8">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bingo - Exibição</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body { background: #000; color: white; }
    .display-screen { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="dark-mode">
  <div class="display-screen">
    <div id="current-number" class="number-display">—</div>
    <div id="history" class="history"></div>
    <div style="margin-top: 2rem; font-size: 1.2rem;">
    <!-- Como não tem logo, use texto -->
    <div style="margin-top: 2rem; font-size: 1.2rem;">Bingo Digital</div>
  </div>

  <script type="module" src="./js/ui/display-ui.js"></script>
</body>
</html>
